# Render Blueprint for the API (Express + MongoDB).
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: us-jamaat-wise-sehat-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_DB_NAME
        value: US-Jamaat-Wise-Data
      # How often an open dashboard reloads its data (seconds).
      - key: DASHBOARD_REFRESH_SECONDS
        value: "120"
      # Sign-in: two random secrets (Render generates them).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Values below are secret / site-specific: Render asks for them when the Blueprint is created.
      - key: MONGODB_URI
        sync: false
      # Google sign-in Client ID (not a secret)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
